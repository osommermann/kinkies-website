name: Build and deploy website

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Build site
        run: |
          mkdir -p _site
          # copy images, CSS, etc. (everything except sources and repo files)
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' \
                --exclude='*.md' ./ _site/
          # convert every Markdown page except the README
          for f in *.md; do
            [ "$f" = "README.md" ] && continue
            pandoc --standalone "$f" -o "_site/${f%.md}.html"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
